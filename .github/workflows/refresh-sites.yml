name: Refresh OpenAI Sites Energy Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-dashboard-sites-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh and verify the Sites snapshot
        run: node scripts/trigger-sites-refresh.mjs
        env:
          SITES_REFRESH_URL: https://hungary-energy-dashboard.andrastoth.chatgpt.site
          MAXIMUM_HEALTH_AGE_MINUTES: "10"
